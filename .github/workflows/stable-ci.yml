name: Tests

on: [push, pull_request, workflow_dispatch]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Install system toolchain (for optional git fallback builds)
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gfortran pkg-config
          if ! command -v cargo >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi

      - name: Setup Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies and Skyborn
        run: |
          python -m pip install --upgrade pip setuptools wheel meson ninja maturin "cython>=3.0.0" numpy
          pip install "skyborn-plot>=0.1.0" || pip install --no-build-isolation git+https://github.com/skyborn-org/skyborn-plot.git
          pip install "skyborn-spharm>=0.2.0" || pip install --no-build-isolation git+https://github.com/skyborn-org/skyborn-spharm.git
          pip install "skyborn-backend>=0.1.0" || pip install --no-build-isolation git+https://github.com/skyborn-org/skyborn-backend.git
          pip install -r requirements/base.txt --no-deps || true
          pip install pytest pandas xarray matplotlib netCDF4 metpy tqdm statsmodels scipy scikit-learn dask
          pip install --no-deps -e .

      - name: Run unit tests
        run: python -B -m pytest -o addopts= -p no:cacheprovider --ignore=tests/test_gradients.py -k "not test_vorticity_with_metpy_crs" -q
